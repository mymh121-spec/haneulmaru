[package]
name = "haneulmaru-video"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
autotests = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
opencv = { version = "=0.102.0", default-features = false, features = ["clang-runtime", "videoio", "imgproc"] }
sha2 = "0.10"
ctrlc = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
