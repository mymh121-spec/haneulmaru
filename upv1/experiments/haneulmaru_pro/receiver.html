<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>하늘마루 PRO · PC 수신</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script><style>#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#0b1725}#overlay{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#remote{touch-action:none}#remoteUi{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between}#remoteUi section{pointer-events:auto;background:#0b1a29db;padding:12px;border-radius:12px;max-width:650px}#remoteUi h1{font-size:20px}#remoteUi .modes{margin:6px 0}#remoteUi input{max-width:230px}#remoteUi p{font-size:12px;margin:5px 0}body.clean #remoteUi section{display:none}#menu{position:fixed;bottom:8px;right:8px;z-index:5}#remoteUi #reopen{display:none}#remoteUi section.top{pointer-events:none}body.ar #remote{visibility:hidden}@media(orientation:landscape){#remoteUi{flex-direction:row;align-items:flex-end}#remoteUi section.top{align-self:flex-start;max-width:35vw}#remoteUi section.controls{max-width:55vw}} </style></head>
<body><video id="camera" autoplay muted playsinline></video><video id="remote" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="remoteUi"><section class="top"><h1>하늘마루 PRO / PC 수신</h1><p id="status">연결 시작을 누르세요</p><p id="metric">PC에서 지형 렌더링 · 폰은 영상 수신</p><p id="transport"></p><p id="gpu"></p></section><section class="controls"><div class="modes"><button id="start">PC 연결 시작</button><button id="environment">카메라 AR로 전환</button><button id="reset">초기 지점</button><button id="sensor">센서 시점</button><button id="top">2D / 3D</button><button id="pause">일시정지</button></div><label>전송 화질 <select id="streamQuality" aria-label="전송 화질"><option value="smooth">부드럽게 · 960</option><option value="balanced">균형 · 1280</option><option value="sharp" selected>선명 · 1920</option><option value="ultra">최고 선명 · 2560</option></select></label><p>숫자는 영상의 긴 변 픽셀입니다. 높은 설정은 PC 부하와 전송량을 늘립니다.</p><label>PC 합성 비행체 <output id="countText">—</output><input id="count" type="range" min="1" max="200" value="24"></label><p>한 손가락 회전 · 두 손가락 핀치 확대 · 가로/세로 자동 대응</p><p>PC와 같은 핫스팟/Wi-Fi가 필요합니다. 폰 카메라 영상은 전송하지 않습니다.</p></section></div><button id="menu">몰입 화면</button><script type="module" src="receiver.js"></script></body></html>
